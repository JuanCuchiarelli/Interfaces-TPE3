<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Mundo Juegos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/animations.css">

</head>
<body class="auth-body">

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="site-header__inner">
    <button class="icon-btn menu-toggle" id="menu-open" aria-label="Abrir menú" aria-controls="side-menu" aria-expanded="false">

        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <a href="index.html" class="logo">
      <img src="img/logo-mundo-juegos.png" alt="Mundo Juegos">
    </a>

    <button type="button" class="icon-btn search-toggle" id="search-toggle" aria-label="Abrir buscador" aria-expanded="false" aria-controls="search-form">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>

    <form class="search-bar" id="search-form" role="search" onsubmit="return false;">
      <input type="search" placeholder="¿A qué jugamos hoy?" aria-label="Buscar juegos">
      <button type="submit" class="icon-btn search-btn" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>

    <a href="login.html" class="profile-btn">
      Perfil
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
      </svg>
    </a>
  </div>
</header>

<!-- ============ MENÚ LATERAL (idéntico al Home) ============ -->
<nav class="side-menu" id="side-menu" aria-label="Menú principal" aria-hidden="true">
  <button class="icon-btn menu-close" id="menu-close" aria-label="Cerrar menú">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="4" y1="4" x2="20" y2="20"/>
      <line x1="20" y1="4" x2="4" y2="20"/>
    </svg>
  </button>

  <div class="side-menu__user">
    <span class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
      </svg>
    </span>
    Hola, Usuario
  </div>

  <ul class="side-menu__list">
    <li><a href="index.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z"/></svg> Inicio</a></li>
    <li><a href="index.html#populares"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a5 5 0 0 0-3 9l-1 5h8l-1-5a5 5 0 0 0-3-9zM9 18h6v2H9z"/></svg> Juegos nuevos</a></li>
    <li><a href="#"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M2 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5zM14.5 20c.3-2.6 1.8-4.3 4-4.7 2 .5 3.2 2.1 3.5 4.7z"/></svg> Multijugador</a></li>
    <li><a href="#"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2a5 5 0 0 0-3 9l-1 5h8l-1-5a5 5 0 0 0-3-9zM9 18h6v2H9z"/></svg> Aventura</a></li>
    <li><a href="#"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="8" cy="8" r="4"/><path d="M11 11 21 21M15 17l3-3"/></svg> Estrategia</a></li>
    <li><a href="#"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l2.6 5.6 6.2.6-4.6 4.1 1.3 6.1L12 16.3 6.5 19.4l1.3-6.1-4.6-4.1 6.2-.6z"/></svg> Mis favoritos</a></li>
    <li><a href="login.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg> Mi perfil</a></li>
  </ul>

  <div class="side-menu__social">
    <p>Seguinos en redes:</p>
    <div class="social-icons">
      <a href="#" aria-label="Instagram"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg></a>
      <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16"/><path d="M14 9h2V6h-2a3 3 0 0 0-3 3v2H9v3h2v5h3v-5h2l1-3h-3v-2a1 1 0 0 1 1-1z"/></svg></a>
      <a href="#" aria-label="YouTube"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M10 9.5v5l5-2.5z" fill="currentColor" stroke="none"/></svg></a>
    </div>
  </div>
</nav>
<div class="side-menu-overlay" id="side-menu-overlay" hidden></div>

<main class="auth-page">
  <section class="auth-card" aria-labelledby="auth-title">
    <h1 class="auth-title" id="auth-title">Creá tu cuenta</h1>

    <div class="auth-tabs" role="tablist" aria-label="Registro o inicio de sesión">
      <button type="button" role="tab" id="tab-register" class="auth-tab is-active" aria-selected="true" aria-controls="panel-register">Registrarme</button>
      <button type="button" role="tab" id="tab-login" class="auth-tab" aria-selected="false" aria-controls="panel-login">Iniciar sesión</button>
    </div>

    <!-- ============ REGISTRO ============ -->
    <form id="panel-register" class="auth-form" role="tabpanel" aria-labelledby="tab-register" novalidate>
      <div class="field">
        <label for="reg-name"><span class="req" aria-hidden="true">*</span> Nombre completo</label>
        <input id="reg-name" name="name" type="text" placeholder="Ingresá tu nombre completo" autocomplete="name" required>
        <p class="field__error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="reg-nick">Nickname</label>
        <input id="reg-nick" name="nickname" type="text" placeholder="Ingresá tu nickname (opcional)" autocomplete="nickname">
        <p class="field__error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="reg-birth"><span class="req" aria-hidden="true">*</span> Fecha de nacimiento</label>
        <input id="reg-birth" name="birth" type="date" autocomplete="bday" required>
        <p class="field__error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="reg-email"><span class="req" aria-hidden="true">*</span> Email</label>
        <input id="reg-email" name="email" type="email" placeholder="Ingresá tu email" autocomplete="email" required>
        <p class="field__error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="reg-pass"><span class="req" aria-hidden="true">*</span> Contraseña</label>
        <input id="reg-pass" name="password" type="password" placeholder="Ingresá tu contraseña" autocomplete="new-password" required>
        <p class="field__error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="reg-pass2"><span class="req" aria-hidden="true">*</span> Repetí contraseña</label>
        <input id="reg-pass2" name="password2" type="password" placeholder="Ingresá tu contraseña" autocomplete="new-password" required>
        <p class="field__error" role="alert" hidden></p>
      </div>

      <div class="field field--captcha">
        <label class="captcha" for="reg-captcha">
          <input id="reg-captcha" type="checkbox">
          <span class="captcha__text">No soy un robot</span>
          <span class="captcha__brand">
            <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 4a8 8 0 0 1 7.5 5.2l-3 .3 4.4 4.3 2.6-5.6-2.3.3A10 10 0 0 0 2.5 9l3 1.3A8 8 0 0 1 12 4z" fill="#3a50ba"/><path d="M12 20a8 8 0 0 1-7.5-5.2l3-.3-4.4-4.3L.5 15.8l2.3-.3A10 10 0 0 0 21.5 15l-3-1.3A8 8 0 0 1 12 20z" fill="#9299ae"/></svg>
            <small>reCAPTCHA</small>
            <small>Privacy · Terms</small>
          </span>
        </label>
        <p class="field__error" role="alert" hidden></p>
      </div>

      <button type="submit" class="btn btn--primary auth-submit">Crear cuenta</button>
    </form>

    <!-- ============ LOGIN ============ -->
    <form id="panel-login" class="auth-form" role="tabpanel" aria-labelledby="tab-login" novalidate hidden>
      <div class="field">
        <label for="log-email"><span class="req" aria-hidden="true">*</span> Email</label>
        <input id="log-email" name="email" type="email" placeholder="Ingresá tu email" autocomplete="email" required>
        <p class="field__error" role="alert" hidden></p>
      </div>

      <div class="field">
        <label for="log-pass"><span class="req" aria-hidden="true">*</span> Contraseña</label>
        <input id="log-pass" name="password" type="password" placeholder="Ingresá tu contraseña" autocomplete="current-password" required>
        <p class="field__error" role="alert" hidden></p>
      </div>

      <button type="submit" class="btn btn--primary auth-submit">Iniciar sesión</button>
      <a href="#" class="auth-forgot">¿Olvidaste tu contraseña?</a>
    </form>

    <!-- ============ REGISTRO EXITOSO ============ -->
    <div class="auth-success" id="auth-success" role="status" hidden>
      <div class="auth-success__icon" aria-hidden="true">
        <svg viewBox="0 0 52 52" width="72" height="72">
          <circle class="success-circle" cx="26" cy="26" r="24" pathLength="100" fill="none" stroke="currentColor" stroke-width="3"/>
          <path class="success-check" d="M14 27l8 8 16-17" pathLength="100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2>¡Cuenta creada con éxito!</h2>
      <p id="auth-success-text">Te damos la bienvenida a Mundo Juegos.</p>
      <a href="index.html" class="btn btn--primary">Ir al inicio</a>
    </div>

    <!-- ============ REDES ============ -->
    <div class="auth-social" id="auth-social">
      <p>O ingresá con</p>
      <div class="auth-social__buttons">
        <button type="button" class="social-btn social-btn--facebook" aria-label="Continuar con Facebook">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-1.6 19.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.3v7A10 10 0 0 0 12 2z"/></svg>
        </button>
        <button type="button" class="social-btn social-btn--google" aria-label="Continuar con Google">
          <svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        </button>
      </div>
    </div>
  </section>
</main>

<script src="js/script.js"></script>
<script src="js/login.js"></script>
</body>
</html>
